agent_options:
  command_line_flags:
    disable_endpointsecurity: false
    disable_endpointsecurity_fim: false
  config:
    decorators:
      load:
      - SELECT uuid AS host_uuid FROM system_info;
      - SELECT hostname AS hostname FROM system_info;
    options:
      disable_distributed: false
      distributed_interval: 10
      distributed_plugin: tls
      distributed_tls_max_attempts: 3
      logger_tls_endpoint: /api/osquery/log
      logger_tls_period: 10
      pack_delimiter: /
  update_channels:
    orbit: 1.38.1
controls:
  enable_disk_encryption: false
  ios_updates:
    deadline:
    minimum_version:
  ipados_updates:
    deadline:
    minimum_version:
  macos_settings:
    custom_settings:
    - path: ../lib/dales-super-cool-test-team/profiles/platform-sso.mobileconfig
    - path: ../lib/dales-super-cool-test-team/profiles/softwareupdatedeclaration.json
  macos_updates:
    deadline:
    minimum_version:
  scripts:
  - path: ../lib/dales-super-cool-test-team/scripts/change_desktop_wallpaper.sh
  - path: ../lib/dales-super-cool-test-team/scripts/remove_mdm_enrollment.ps1
  - path: ../lib/dales-super-cool-test-team/scripts/set_dns_cloudflare.sh
  - path: ../lib/dales-super-cool-test-team/scripts/set_dns_google.sh
  - path: ../lib/dales-super-cool-test-team/scripts/uninstall-fleetd-macos.sh
  windows_enabled_and_configured: true
  windows_settings:
    custom_settings:
    - path: ../lib/dales-super-cool-test-team/profiles/officeadmxingest.xml
    - path: ../lib/dales-super-cool-test-team/profiles/officeupdates.xml
  windows_updates:
    deadline_days:
    grace_period_days:
name: Dale's Super Cool Test Team
policies:
- calendar_events_enabled: false
  critical: false
  description: Possible risks include the laptop not being managed by FleetDM, not
    receiving updates, or not adhering to security policies. There may also be a risk
    of unauthorized software or malicious activities being undetected.
  name: Fleet Desktop Enabled
  platform: darwin
  query: SELECT 1 FROM plist WHERE path = '/Library/LaunchDaemons/com.fleetdm.orbit.plist'
    AND key = 'EnvironmentVariables' AND subkey = 'ORBIT_FLEET_DESKTOP' AND value
    = 'false';
  resolution:
- calendar_events_enabled: false
  critical: false
  description:
  name: Full disk encryption enabled on Linux
  platform: linux
  query: SELECT 1 FROM mounts m, disk_encryption d WHERE m.device_alias = d.name AND
    d.encrypted = 1 AND m.path = '/';
  resolution:
- calendar_events_enabled: false
  critical: false
  description:
  name: Has cloud flare DNS
  platform: linux
  query: SELECT 1 FROM dns_resolvers WHERE type='nameserver' AND address LIKE '1.1.1.1';
  resolution:
- calendar_events_enabled: false
  critical: false
  description: Policy triggers automatic install of Brave on each host that's missing
    this software.
  install_software:
    hash_sha256: 002d4a409827df50674c205fcf2415e855580e385eb422dc44d6a9e61f34f83a
      # Brave (Brave-Browser-arm64.dmg) version 135.1.77.97
  name: '[Install software] Brave'
  platform: darwin
  query: SELECT 1 FROM apps WHERE bundle_identifier = 'com.brave.Browser';
  resolution:
- calendar_events_enabled: false
  critical: false
  description: Policy triggers automatic install of Microsoft AutoUpdate.app on each
    host that's missing this software.
  install_software:
    hash_sha256: d5fce20926d01bc6038a5e2ef39a9c7313bfcb4ed29309745d844c5cc2bced5b
      # Microsoft AutoUpdate (CompanyPortal-Installer.pkg) version 4.78, 4.79
  name: '[Install software] Microsoft AutoUpdate.app (pkg)'
  platform: darwin
  query: SELECT 1 FROM apps WHERE bundle_identifier = 'com.microsoft.autoupdate2';
  resolution:
- calendar_events_enabled: false
  critical: false
  description:
  name: Has Cloudflare DNS
  platform: linux
  query: SELECT 1 FROM dns_resolvers WHERE type='nameserver' AND address LIKE '1.1.1.1';
  resolution:
  run_script:
    path: ../lib/dales-super-cool-test-team/scripts/set_dns_cloudflare.sh
queries:
- automations_enabled: false
  description:
  discard_data: false
  interval: 300
  logging: snapshot
  min_osquery_version:
  name: Test this query
  observer_can_run: false
  platform:
  query: SELECT * FROM osquery_info;
- automations_enabled: false
  description:
  discard_data: false
  interval: 300
  logging: snapshot
  min_osquery_version:
  name: Copy of Test this query
  observer_can_run: false
  platform:
  query: SELECT * FROM osquery_flags;
