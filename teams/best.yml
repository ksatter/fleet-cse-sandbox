agent_options:
  command_line_flags:
    disable_audit: false
    disable_events: false
    enable_ntfs_event_publisher: true
    enable_powershell_events_subscriber: true
    enable_windows_events_publisher: true
    enable_windows_events_subscriber: true
  config:
    auto_table_construction:
      firefox_url_history:
        columns:
        - guid
        - url
        - title
        - visit_count
        - last_visit_date
        - hidden
        path: /Users/%/Library/Application Support/Firefox/Profiles/%/places.sqlite
        query: SELECT guid, url, title, visit_count, last_visit_date,  hidden FROM
          moz_places
    decorators:
      load:
      - SELECT uuid AS host_uuid FROM system_info;
      - SELECT hostname AS hostname FROM system_info;
    options:
      disable_distributed: false
      distributed_interval: 10
      distributed_plugin: tls
      distributed_tls_max_attempts: 3
      logger_tls_endpoint: /api/osquery/log
      logger_tls_period: 10
      pack_delimiter: /
controls:
  enable_disk_encryption: false
  ios_updates:
    deadline:
    minimum_version:
  ipados_updates:
    deadline:
    minimum_version:
  macos_updates:
    deadline:
    minimum_version:
  scripts:
  - path: ../lib/best/scripts/2025-02-11 test.sh
  - path: ../lib/best/scripts/enable_fleetd_scripts_windows.ps1
  - path: ../lib/best/scripts/fail.sh
  - path: ../lib/best/scripts/winget_installtest.ps1
  - path: ../lib/best/scripts/winget_prep.ps1
  - path: ../lib/best/scripts/winget_test2.ps1
  windows_enabled_and_configured: true
  windows_updates:
    deadline_days:
    grace_period_days:
name: Best
policies:
- calendar_events_enabled: false
  critical: false
  description:
  install_software:
    hash_sha256: b2c92114d8bb359b5e3713e45aeea33dce8ef7da40a4aea266f016df5bf2f966
      # Fleet osquery (fleet-osquery.pkg) version 
  name: Always Fail
  platform: darwin,windows,linux,chrome
  query: SELECT 1 WHERE 1 = 2;
  resolution:
- calendar_events_enabled: false
  critical: false
  description: 'The file is good. Embrace the good. '
  name: Good file present
  platform: darwin,windows,linux
  query: SELECT 1 FROM file WHERE path like '/Users/%/Desktop/good.txt';
  resolution: 'Create the good file. '
  run_script:
    path: ../lib/best/scripts/fail.sh
queries:
- automations_enabled: true
  description:
  discard_data: false
  interval: 300
  logging: snapshot
  min_osquery_version:
  name: Frequent query
  observer_can_run: false
  platform: darwin,windows,linux,chrome
  query: SELECT * FROM osquery_info;
- automations_enabled: true
  description:
  discard_data: false
  interval: 300
  logging: differential
  min_osquery_version:
  name: Differential query
  observer_can_run: false
  platform: darwin,windows,linux
  query: SELECT * FROM file WHERE path like "/Users/%/look_here/%"
