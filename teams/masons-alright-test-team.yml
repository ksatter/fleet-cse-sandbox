agent_options:
  config:
    decorators:
      load:
      - SELECT uuid AS host_uuid FROM system_info;
      - SELECT hostname AS hostname FROM system_info;
    options:
      disable_distributed: false
      distributed_interval: 59
      distributed_plugin: tls
      distributed_tls_max_attempts: 3
      logger_tls_endpoint: /api/osquery/log
      logger_tls_period: 10
      pack_delimiter: /
  overrides:
    platforms:
      darwin:
        auto_table_construction:
          chrome_history:
            columns:
            - last_visited
            - url
            - title
            - visit_count
            path: /Users/%/Library/Application Support/Google/Chrome/Default/History
            query: SELECT datetime(last_visit_time/1000000-11644473600, "unixepoch")
              as last_visited, url, title, visit_count FROM urls;
      linux:
        auto_table_construction:
          chrome_history:
            columns:
            - last_visited
            - url
            - title
            - visit_count
            path: /home/%/.config/google-chrome/Default/History
            query: SELECT datetime(last_visit_time/1000000-11644473600, "unixepoch")
              as last_visited, url, title, visit_count FROM urls;
          test_table:
            columns:
            - ID
            - name
            path: /home/%/test.db
            query: SELECT * FROM test_table
controls:
  enable_disk_encryption: false
  ios_updates:
    deadline:
    minimum_version:
  ipados_updates:
    deadline:
    minimum_version:
  macos_updates:
    deadline:
    minimum_version:
  scripts:
  - path: ../lib/masons-alright-test-team/scripts/installtest.sh
  - path: ../lib/masons-alright-test-team/scripts/test1.sh
  windows_enabled_and_configured: true
  windows_updates:
    deadline_days:
    grace_period_days:
name: Mason's Alright Test Team
policies:
- calendar_events_enabled: false
  critical: false
  description: |-
    Policy triggers automatic install of webex on each host that's missing this software.
    Software won't be installed on Linux hosts with RPM-based distributions because this policy's query is written to always pass on these hosts.
  install_software:
    hash_sha256: 4827d3bea7e3856006d75240486731f0bef531875d3b8ee058efc95270a9d79f
      # webex (Webex.deb) version 
  name: '[Install software] webex (deb)'
  platform: linux
  query: "SELECT 1 WHERE EXISTS (\n\tSELECT 1 WHERE (SELECT COUNT(*) FROM deb_packages)
    = 0\n) OR EXISTS (\n\tSELECT 1 FROM deb_packages WHERE name = 'webex'\n);"
  resolution:
- calendar_events_enabled: false
  critical: false
  description: |-
    Policy triggers automatic install of code on each host that's missing this software.
    Software won't be installed on Linux hosts with RPM-based distributions because this policy's query is written to always pass on these hosts.
  install_software:
    hash_sha256: 42cdfa55cb63d707e21457b37672491735e79c7d3818e658438a07cb3871b5c2
      # code (code_1.100.2-1747260578_amd64.deb) version 
  name: '[Install software] code (deb)'
  platform: linux
  query: "SELECT 1 WHERE EXISTS (\n\tSELECT 1 WHERE (SELECT COUNT(*) FROM deb_packages)
    = 0\n) OR EXISTS (\n\tSELECT 1 FROM deb_packages WHERE name = 'code'\n);"
  resolution:
queries:
- automations_enabled: false
  description: Selects all from chrome_extensions.
  discard_data: false
  interval: 3600
  logging: snapshot
  min_osquery_version:
  name: Chrome Extensions
  observer_can_run: false
  platform: darwin,windows,linux,chrome
  query: SELECT * FROM chrome_extensions;
